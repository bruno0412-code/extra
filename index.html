<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Informações</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Arial', sans-serif;
    background-color: #f2f2f2;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 1100px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
    padding: 40px;
    width: 100%;
  }

  .left-side {
    width: 40%;
    text-align: center;
  }

  .left-side img {
    width: 100%;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
  }

  .right-side {
    width: 55%;
  }

  .right-side h1 {
    color: #555;
    margin-bottom: 30px;
    font-size: 36px;
    font-weight: bold;
  }

  button {
    width: 100%;
    padding: 15px;
    background-color: #333;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    margin-bottom: 25px;
    transition: background-color 0.3s ease;
  }

  button:hover {
    background-color: #555;
  }

  .info {
    display: none;
    padding: 20px;
    background-color: #eaeaea;
    border-radius: 8px;
    font-size: 16px;
    margin-bottom: 30px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
  }

  .info.show {
    display: block;
  }

  .tools-link {
    margin-top: 40px;
    text-align: center;
  }

  .tools-link a {
    text-decoration: none;
    background-color: #333;
    color: white;
    padding: 15px 30px;
    border-radius: 8px;
    transition: background-color 0.3s ease;
  }

  .tools-link a:hover {
    background-color: #555;
  }

  @media screen and (max-width: 768px) {
    .container {
      flex-direction: column;
      padding: 20px;
    }

    .left-side {
      width: 100%;
      margin-bottom: 20px;
    }

    .right-side {
      width: 100%;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="left-side">
    <img src="imagens/sua-imagem.jpg" alt="Minha Foto">
  </div>

  <div class="right-side">
    <h1>Minhas Informações</h1>

    <button onclick="toggleInfo('idade')">Minha Idade</button>
    <div id="idade" class="info">Tenho 25 anos.</div>

    <button onclick="toggleInfo('curso')">Meu Curso</button>
    <div id="curso" class="info">Estou cursando Recursos Humanos.</div>

    <button onclick="toggleInfo('objetivo')">Meu Objetivo</button>
    <div id="objetivo" class="info">Meu objetivo é atuar como analista de RH focando em recrutamento e seleção.</div>

    <button onclick="toggleInfo('historia')">Minha História</button>
    <div id="historia" class="info">Comecei a trabalhar na área administrativa e desenvolvi paixão por gestão de pessoas. Por isso, ingressei no curso de RH.</div>

    <div class="tools-link">
      <a href="ferramentas.html">Acessar Ferramentas</a>
    </div>
  </div>
</div>

<script>
  function toggleInfo(id) {
    const elem = document.getElementById(id);
    elem.classList.toggle('show');
  }
</script>

</body>
</html>
