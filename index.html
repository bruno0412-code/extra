<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Minhas Informações</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Arial', sans-serif;
    background-color: #f7f7f7; /* Cor de fundo mais clara */
    color: #333;
    padding: 40px;
    line-height: 1.6;
    transition: background-color 0.3s ease;
  }

  h1 {
    text-align: center;
    margin-bottom: 40px;
    color: #333;
    font-size: 2rem;
    font-weight: 600;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 30px;
    background-color: #ffffff; /* Fundo branco */
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  }

  button {
    width: 100%;
    padding: 18px;
    background-color: #2c3e50; /* Tom moderno de azul escuro */
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    margin-bottom: 20px;
    transition: background-color 0.3s ease, transform 0.2s ease;
    font-weight: 500;
  }

  button:hover {
    background-color: #34495e; /* Tom mais claro */
    transform: translateY(-3px); /* Sutil efeito de elevação */
  }

  .info {
    display: none;
    margin-top: 20px;
    padding: 20px;
    background-color: #ecf0f1; /* Cor de fundo suave para as caixas de informação */
    border-radius: 10px;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
  }

  .info.show {
    display: block;
    opacity: 1;
  }

  .ferramentas-btn {
    width: 100%;
    padding: 18px;
    background-color: #2c3e50; /* Azul escuro */
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 20px;
    transition: background-color 0.3s ease, transform 0.2s ease;
    text-align: center;
    font-weight: 500;
  }

  .ferramentas-btn:hover {
    background-color: #34495e;
    transform: translateY(-3px);
  }

  img {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    margin-bottom: 20px;
    display: block;
    margin-left: auto;
    margin-right: auto;
    opacity: 0;
    transition: opacity 1s ease;
  }

  img.loaded {
    opacity: 1;
  }

  @media screen and (max-width: 600px) {
    .container {
      padding: 20px;
    }
    button {
      font-size: 16px;
      padding: 15px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Minhas Informações</h1>

  <!-- Imagem de perfil -->
  <img src="minha-foto.jpg" alt="Minha Foto" class="foto-perfil">

  <!-- Botões interativos -->
  <button onclick="toggleInfo('idade')">Minha Idade</button>
  <div id="idade" class="info">Tenho 25 anos.</div>

  <button onclick="toggleInfo('curso')">Meu Curso</button>
  <div id="curso" class="info">Estou cursando Recursos Humanos.</div>

  <button onclick="toggleInfo('objetivo')">Meu Objetivo</button>
  <div id="objetivo" class="info">Meu objetivo é atuar como analista de RH focando em recrutamento e seleção.</div>

  <button onclick="toggleInfo('historia')">Minha História</button>
  <div id="historia" class="info">Comecei a trabalhar na área administrativa e desenvolvi paixão por gestão de pessoas. Por isso, ingressei no curso de RH.</div>

  <!-- Botão para ir para a segunda página -->
  <button class="ferramentas-btn" onclick="window.location.href='ferramentas.html'">Ferramentas</button>
</div>

<script>
  function toggleInfo(id) {
    const elem = document.getElementById(id);
    elem.classList.toggle('show');
  }

  window.addEventListener('load', () => {
    document.querySelector('img').classList.add('loaded');
  });
</script>

</body>
</html>
