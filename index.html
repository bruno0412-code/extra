<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Minhas Informações</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Arial', sans-serif;
    background-color: #f4f4f9;
    color: #333;
    display: flex;
    height: 100vh;
  }

  .sidebar {
    width: 40%;
    background: url('minha-foto.jpg') no-repeat center center;
    background-size: cover;
  }

  .content {
    width: 60%;
    padding: 40px;
    background-color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  h1 {
    margin-bottom: 30px;
    color: #333;
  }

  button {
    width: 100%;
    padding: 15px;
    background-color: #333;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    margin-bottom: 30px;
    transition: background-color 0.3s;
  }

  button:hover {
    background-color: #555;
  }

  .info {
    display: none;
    margin-bottom: 30px;
    padding: 15px;
    background-color: #f1f1f1;
    border-radius: 8px;
    font-size: 16px;
  }

  .info.show {
    display: block;
  }

  a.ferramentas {
    margin-top: 40px;
    display: inline-block;
    padding: 12px 20px;
    background-color: #333;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    text-align: center;
  }

  a.ferramentas:hover {
    background-color: #555;
  }
</style>
</head>
<body>

<div class="sidebar"></div>

<div class="content">
  <h1>Minhas Informações</h1>

  <button onclick="toggleInfo('idade')">Minha Idade</button>
  <div id="idade" class="info">Tenho 25 anos.</div>

  <button onclick="toggleInfo('curso')">Meu Curso</button>
  <div id="curso" class="info">Estou cursando Recursos Humanos.</div>

  <button onclick="toggleInfo('objetivo')">Meu Objetivo</button>
  <div id="objetivo" class="info">Meu objetivo é atuar como analista de RH focando em recrutamento e seleção.</div>

  <button onclick="toggleInfo('historia')">Minha História</button>
  <div id="historia" class="info">Comecei a trabalhar na área administrativa e desenvolvi paixão por gestão de pessoas. Por isso, ingressei no curso de RH.</div>

  <a href="ferramentas.html" class="ferramentas">Ferramentas</a>
</div>

<script>
  function toggleInfo(id) {
    const elem = document.getElementById(id);
    elem.classList.toggle('show');
  }
</script>

</body>
</html>
