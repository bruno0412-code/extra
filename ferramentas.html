<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ferramentas que Estou Aprendendo</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    color: white;
    height: 100vh;
    background: url('fundo-ferramentas.jpg') no-repeat center center;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .box-container {
    background-color: rgba(0,0,0,0.7);
    padding: 30px;
    border-radius: 10px;
    max-width: 600px;
    text-align: center;
  }

  .tool {
    background-color: rgba(255,255,255,0.2);
    border-radius: 8px;
    margin: 20px 0;
    padding: 20px;
  }

  .tool h2 {
    margin-bottom: 10px;
    color: #ffffff;
  }

  .tool p {
    font-size: 16px;
    color: #ddd;
  }

  a.voltar {
    margin-top: 20px;
    display: inline-block;
    padding: 12px 20px;
    background-color: #333;
    color: white;
    border-radius: 8px;
    text-decoration: none;
  }

  a.voltar:hover {
    background-color: #555;
  }
</style>
</head>
<body>

<div class="box-container">
  <h1>Ferramentas que Estou Aprendendo</h1>

  <div class="tool">
    <h2>GitHub</h2>
    <p>Estou me dedicando a aprender GitHub para versionar meus projetos e colaborar em equipe.</p>
  </div>

  <div class="tool">
    <h2>Python</h2>
    <p>Estou estudando Python para ampliar minhas habilidades de automação e análise de dados.</p>
  </div>

  <a href="index.html" class="voltar">Voltar</a>
</div>

</body>
</html>
